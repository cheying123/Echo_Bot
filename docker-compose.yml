# QQ AI Bot — Docker Compose
# ===========================
# 使用方式：
#   1. 复制 .env.example 为 .env，填入 API Key
#   2. docker compose up -d
#   3. 确保 go-cqhttp 的 ws_reverse 指向 ws://主机IP:8765
#
# 日志查看: docker compose logs -f

services:
  bot:
    build: .
    container_name: qq-ai-bot
    restart: unless-stopped
    ports:
      - "8765:8765"
    mem_limit: 512m
    mem_reservation: 256m
    oom_kill_disable: false
    environment:
      # API 配置（优先从 .env 文件读取）
      - AIBOT_LLM__API_KEY=${AIBOT_LLM__API_KEY:?请设置 AIBOT_LLM__API_KEY}
      - AIBOT_LLM__PROVIDER=${AIBOT_LLM__PROVIDER:-deepseek}
      - AIBOT_LLM__BASE_URL=${AIBOT_LLM__BASE_URL:-}
      - AIBOT_LLM__MODEL=${AIBOT_LLM__MODEL:-}
      # 代理（可选）
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      # go-cqhttp 地址
      - AIBOT_SERVER__HTTP_API_URL=${AIBOT_SERVER__HTTP_API_URL:-http://host.docker.internal:5700}
    volumes:
      - ./data:/app/data
      - ./characters:/app/characters
      - ./config.yml:/app/config.yml
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
